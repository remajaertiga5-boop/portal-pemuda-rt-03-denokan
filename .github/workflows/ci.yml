# ============================================================
# GITHUB ACTIONS - INTEGRATION & BUILD VALIDATION
# ============================================================

name: CI/CD Build & Lint Validation

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'   # Pastikan file .nvmrc ada
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Project Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Code Linter Check
        run: npm run lint

      # Uncomment jika project TypeScript
      # - name: Run Type Check
      #   run: npm run type-check

      - name: Compile & Build Frontend Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/        # Ubah jika output folder bukan dist/
          retention-days: 7
          if-no-files-found: error
