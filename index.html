    <!-- ============================================================
         THEME INIT SCRIPT
         ✅ Dijalankan SEBELUM React mount — cegah Flash of Wrong Theme
         ✅ Sinkron dengan ThemeContext.tsx & main.tsx
         ============================================================ -->
    <script>
      (function () {
        try {
          var root       = document.documentElement;
          var store      = localStorage;

          // ── TEMA ──────────────────────────────────────────────
          var theme      = store.getItem('app-theme') || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark     = theme === 'dark' || (theme === 'system' && systemDark);

          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }

          // ── FONT SIZE ─────────────────────────────────────────
          var fontSizeMap = {
            'Kecil'       : '14px',
            'Normal'      : '16px',
            'Besar'       : '18px',
            'Sangat Besar': '20px'
          };
          var fontSize = store.getItem('app-font-size') || 'Normal';
          root.style.fontSize = fontSizeMap[fontSize] || '16px';

          // ── AKSESIBILITAS ─────────────────────────────────────
          if (store.getItem('app-high-contrast') === 'true') {
            root.classList.add('high-contrast');
          }
          if (store.getItem('app-reduce-motion') === 'true') {
            root.classList.add('reduce-motion');
          }

          // ── ACCENT COLOR ──────────────────────────────────────
          var validAccents = ['green', 'blue', 'rose', 'amber', 'purple'];
          var accent = store.getItem('app-accent-color') || 'green';
          root.setAttribute('data-accent', validAccents.indexOf(accent) !== -1 ? accent : 'green');

          // ── BAHASA & ARAH TEKS ────────────────────────────────
          var validLangs = ['id', 'en', 'jv', 'slg'];
          var lang = store.getItem('app-language') || 'id';
          root.setAttribute('lang', validLangs.indexOf(lang) !== -1 ? lang : 'id');

        } catch (e) {
          // localStorage tidak tersedia
        }
      })();
    </script>
  </head>
